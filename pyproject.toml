[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-provider"
version = "0.2.0"
description = "TUI to quickly switch Claude Code / Codex API providers"
requires-python = ">=3.9"
dependencies = ["textual>=0.80", "tomlkit>=0.12"]

[project.scripts]
claude-provider = "claude_provider.cli:main"
ccp = "claude_provider.cli:main"

[tool.setuptools]
packages = ["claude_provider"]
